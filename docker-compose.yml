version: "3.9"

services:
  web:
    build: .
    container_name: django_web
    command: python manage.py runserver 0.0.0.0:8000
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - static_volume:/code/static
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  db:
    image: postgres:16
    container_name: django_postgres
    restart: always
    env_file:
      - .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    expose:
      - "5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $POSTGRES_USER" ]
      interval: 10s
      timeout: 5s
      retries: 3

  redis:
    image: redis:7
    container_name: django_redis
    ports:
      - "6379:6379"

  celery:
    build: .
    container_name: django_celery
    command: celery -A config worker -l info -P solo
    env_file:
      - .env
    depends_on:
      - redis
      - db

  celery-beat:
    build: .
    container_name: django_celery_beat
    command: celery -A config beat -l info
    env_file:
      - .env
    depends_on:
      - redis
      - db

networks:
  default:

volumes:
  static_volume:
  postgres_data:
